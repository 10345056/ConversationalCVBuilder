services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__CvBuilder: "Data Source=/data/conversational-cv-builder.db;Cache=Shared"
    ports:
      - "8080:8080"
    volumes:
      - sqlite-data:/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  sqlite-data:
